name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker
        run: docker build -t giovanna092/lacrei-devsecops:latest .

      - name: Publicar imagem no Docker Hub
        run: docker push giovanna092/lacrei-devsecops:latest

      - name: Deploy na AWS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo docker pull giovanna092/lacrei-devsecops:latest
            sudo docker stop lacrei-app || true
            sudo docker rm lacrei-app || true
            sudo docker run -d --name lacrei-app --restart unless-stopped -p 3000:3000 giovanna092/lacrei-devsecops:latest